<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register Consumption - PresChop</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css?family=Roboto:400,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/styles.css">
</head>
<body>
  <div id="header-include"></div>
  <div class="main-content">
    <div class="container mt-4">
      <!-- Notification for Canteen Manager -->
      <!-- this is the alert for the canteen boss -->
      <div class="alert alert-warning alert-dismissible fade show" role="alert">
        <strong><i class="fa fa-bell"></i> Approval Needed!</strong> There are new workers pending approval. <a href="#" class="alert-link">Review now</a>.
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
      </div>
      <div class="card mx-auto mt-5" style="max-width: 600px;">
        <div class="card-body">
          <h2 class="card-title text-center mb-4" style="color:#ff6600;"><i class="fa fa-utensils"></i> Register Consumption</h2>
          <form>
            <div class="mb-3">
              <label for="worker" class="form-label">Worker</label>
              <select class="form-select" id="worker" required>
                <option value="">Select Worker</option>
                <option value="1">John Doe</option>
                <option value="2">Jane Smith</option>
                <!-- Populate dynamically in real app -->
              </select>
            </div>
            <div class="mb-3">
              <label for="type" class="form-label">Type of Consumption</label>
              <select class="form-select" id="type" required>
                <option value="">Select Type</option>
                <option value="Food">Food</option>
                <option value="Drink">Drink</option>
              </select>
            </div>
            <div class="mb-3">
              <label for="amount" class="form-label">Amount Consumed</label>
              <input type="number" class="form-control" id="amount" min="1" required>
            </div>
            <div class="mb-3">
              <label for="date" class="form-label">Consumption Date</label>
              <input type="date" class="form-control" id="date" required>
            </div>
            <button type="submit" class="btn btn-primary w-100" style="background:#ff6600; border:none;">Register Consumption</button>
          </form>
        </div>
      </div>
    </div>
  </div>
  <div id="footer-include"></div>
  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Load header and footer components dynamically
    fetch('components/header.html').then(res => res.text()).then(data => {
      document.getElementById('header-include').innerHTML = data;
    });
    fetch('components/footer.html').then(res => res.text()).then(data => {
      document.getElementById('footer-include').innerHTML = data;
      const yearSpan = document.getElementById('footerYear');
      if (yearSpan) {
        yearSpan.textContent = new Date().getFullYear();
      }
    });
  </script>
</body>
</html>
