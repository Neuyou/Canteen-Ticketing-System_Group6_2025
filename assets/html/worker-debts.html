<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Worker Debts - PresChop</title>

  
  <link href="../css/bootstrap.min.css" rel="stylesheet">
  <link href="../css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">

  <style>

.action-btn {
  background: #ff6600 !important;
  color: #fff !important;
  border: 2px solid transparent !important; /* keep constant border to avoid layout jump */
  font-weight: 500;
  transition: background-color 0.2s, color 0.2s, border-color 0.2s; /* only color transitions */
  box-sizing: border-box; /* ensure border does not change size */
  margin-bottom: 0;
}

.action-btn:hover, .action-btn:focus {
  background: #fff !important;
  color: #ff6600 !important;
  border-color: #ff6600 !important; /* change color, not width */
}

@media (max-width: 575.98px) {
  td > .action-btn {
    display: block;
    width: 100%;
    margin-bottom: 8px;
    margin-right: 0 !important;
  }
  td > .action-btn:last-child {
    margin-bottom: 0;
  }
}

</style>

</head>

<body>

  <div id="top-wrapper">
  <div id="header-include"></div>
  <div class="main-content">
    <div class="container mt-4">

      
      <div class="card mt-5">
        <div class="card-body">
          <h2 class="card-title text-center mb-4" style="color:#ff6600;"><i class="fa fa-list"></i> Worker Debts</h2>
          <div class="alert alert-info py-2" role="alert" style="background:#fff3e0; border:2px solid #ff6600; color:#333;">
            <small>
              <strong>Note:</strong> Inactive workers cannot register new consumptions. Use the <em>Activate/Deactivate</em> button in the Actions column to change a worker's status.
            </small>
          </div>
          
          <div class="mb-3 d-flex flex-wrap gap-2">
            <button type="button" class="btn" id="exportCSV" style="background:#ff6600; color:#fff; border:none;"><i class="fa fa-file-csv"></i> Export as CSV</button>
            <button type="button" class="btn" id="exportExcel" style="background:#ff6600; color:#fff; border:none;"><i class="fa fa-file-excel"></i> Export as Excel</button>
          </div>

          
          <form id="filterForm" class="row g-2 mb-4 align-items-end">
            <div class="col-12 col-sm-4">
              <label class="form-label mb-1">Worker Name</label>
              <input type="text" class="form-control" id="filterName" placeholder="Enter name">
            </div>

            <div class="col-6 col-sm-3">
              <label class="form-label mb-1">Department</label>
              <select class="form-select" id="filterDepartment">
                <option value="">All</option>
                <option value="IT">IT</option>
                <option value="Marketing">Marketing</option>
                <option value="Finance">Finance</option>
                <option value="Human Resources">Human Resources</option>
                <option value="Communication">Communication</option>
                <option value="Operations">Operations</option>
              </select>
            </div>

            <div class="col-6 col-sm-3">
              <label class="form-label mb-1">Status</label>
              <select class="form-select" id="filterStatus">
                <option value="">All</option>
                <option value="Permanent">Permanent</option>
                <option value="Temporal">Temporal</option>
                <option value="Intern">Intern</option>
              </select>
            </div>

            <div class="col-12 col-sm-2 d-grid">
              <button type="button" class="btn" id="clearFilters" style="background:#ff6600; color:#fff; border:none;">Search</button>
            </div>
          </form>
          <div class="table-responsive">
            <table class="table table-bordered align-middle">
              <thead class="table-dark">
                <tr>
                  <th>No</th>
                  <th>Worker Name</th>
                  <th>Department</th>
                  <th>Status</th>
                  <th>Debt</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <!-- <td>1</td>
                  <td>Dyl Padaran</td>
                  <td>Food</td>
                  <td>300</td>
                  <td>2024-06-01</td>
                  <td>IT</td>
                  <td>Permanent</td>
                  <td>1500</td>
                  <td>
                    <button class="btn action-btn me-1" style="background:#ff6600; color:#fff; border:none;" data-action="mark-paid"><i class="fa fa-check"></i> Mark as Paid</button>
                    <button class="btn action-btn me-1" style="background:#ff6600; color:#fff; border:none;" data-action="edit"><i class="fa fa-edit"></i> Edit</button>
                    <!-- <!-- <button class="btn action-btn" style="background:#ff6600; color:#fff; border:none;" data-action="delete"><i class="fa fa-trash"></i> Delete</button> -->
                  <!--/td-->
                </tr>
                <tr>
                  <!-- <td>2</td>
                  <td>Neuyou Guilaine</td>
                  <td>Drink</td>
                  <td>250</td>
                  <td>2024-06-02</td>
                  <td>IT</td>
                  <td>Intern</td>
                  <td>400</td>
                  <td>
                    <button class="btn action-btn me-1" style="background:#ff6600; color:#fff; border:none;" data-action="mark-paid"><i class="fa fa-check"></i> Mark as Paid</button>
                    <button class="btn action-btn me-1" style="background:#ff6600; color:#fff; border:none;" data-action="edit"><i class="fa fa-edit"></i> Edit</button>
                    <!-- <button class="btn action-btn" style="background:#ff6600; color:#fff; border:none;" data-action="delete"><i class="fa fa-trash"></i> Delete</button> -->
                  <!--/td-->
                </tr>
                 <tr>
                  <!-- <td>3</td>
                  <td>Ayuk Hillman</td>
                  <td>Food and Drink</td>
                  <td>1000</td>
                  <td>2024-06-03</td>
                  <td>IT</td>
                  <td>Temporal</td>
                  <td>2000</td>
                  <td>>
                    <button class="btn action-btn me-1" style="background:#ff6600; color:#fff; border:none;" data-action="mark-paid"><i class="fa fa-check"></i> Mark as Paid</button>
                    <button class="btn action-btn me-1" style="background:#ff6600; color:#fff; border:none;" data-action="edit"><i class="fa fa-edit"></i> Edit</button>
                    <!-- <button class="btn action-btn" style="background:#ff6600; color:#fff; border:none;" data-action="delete"><i class="fa fa-trash"></i> Delete</button> -->
                  <!--/td-->
                </tr>

              

              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  
  <div class="modal fade" id="markPaidModal" tabindex="-1" aria-labelledby="markPaidModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header" style="background:#fff3e0; border-bottom:2px solid #ff6600;">
          <h5 class="modal-title" id="markPaidModalLabel"><i class="fa fa-check" style="color:#ff6600;"></i> <span style="color:#ff6600;">Mark as Paid</span></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>

        <div class="modal-body" style="color:#222;">
          Are you sure you want to mark this debt as paid?
        </div>
        <div class="modal-footer" style="background:#fff3e0; border-top:2px solid #ff6600;">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn" id="confirmMarkPaid" style="background:#ff6600; color:#fff; border:none;">Yes, Mark as Paid</button>
        </div>
      </div>
    </div>
  </div>

  
  <div class="modal fade" id="editModal" tabindex="-1" aria-labelledby="editModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header" style="background:#fff3e0; border-bottom:2px solid #ff6600;">
          <h5 class="modal-title" id="editModalLabel"><i class="fa fa-edit" style="color:#ff6600;"></i> <span style="color:#ff6600;">Edit Record</span></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>

        <div class="modal-body" style="color:#222;">
          <form id="editForm">
            <div class="mb-2">
              <label class="form-label">Worker Name</label>
              <input type="text" class="form-control" id="editWorkerName" required>
            </div>

            <div class="mb-2">
              <label class="form-label">Department</label>
              <input type="text" class="form-control" id="editDepartment" required>
            </div>

            <div class="mb-2">
              <label class="form-label">Status</label>
              <input type="text" class="form-control" id="editStatus" required>
            </div>

            <div class="mb-2">
              <label class="form-label">Debt</label>
              <input type="number" class="form-control" id="editDebt">
            </div>
          </form>
        </div>

        <div class="modal-footer" style="background:#fff3e0; border-top:2px solid #ff6600;">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn" id="saveEdit" style="background:#ff6600; color:#fff; border:none;">Save Changes</button>
        </div>
      </div>
    </div>
  </div>


  <div id="actionAlert" class="alert d-none position-fixed top-0 start-50 translate-middle-x mt-3" style="z-index: 2000; min-width: 300px; background:#fff3e0; color:#ff6600; border:2px solid #ff6600; font-weight:500;" role="alert"></div>

  </div>

  <div id="footer-include"></div>

  <script src="../js/xlsx.full.min.js"></script>
  <script src="../js/bootstrap.bundle.min.js"></script>

  <script src="../js/custom/db.js"></script>
  <script src="../js/custom/worker-debts.js"></script>

</body>
</html>
