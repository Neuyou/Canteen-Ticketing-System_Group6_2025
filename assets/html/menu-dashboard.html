<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canteen Menu Dashboard - PresChop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css?family=Roboto:400,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/styles.css">
</head>
<body>
  <div id="header-include"></div>
  <div class="main-content">
    <div class="container mt-4">
      <!-- Notification for Canteen Manager -->
      <!-- this is the alert for the canteen boss -->
      <div class="alert alert-warning alert-dismissible fade show" role="alert">
        <strong><i class="fa fa-bell"></i> Approval Needed!</strong> There are new workers pending approval. <a href="#" class="alert-link">Review now</a>.
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
      </div>
      <div class="text-center mt-5">
        <h1 style="color:#ff6600;">Canteen Menu Dashboard</h1>
        <p class="lead">Overview of the week's/daily menu</p>
        <div class="row justify-content-center mt-4">
          <div class="col-12 col-md-6 mb-3">
            <div class="card shadow-sm">
              <div class="card-body text-center">
                <i class="fa fa-calendar-alt fa-2x mb-2" style="color:#ff6600;"></i>
                <h5 class="card-title">Today's Menu</h5>
                <p class="card-text">--</p>
                <a href="menu-add.html" class="btn mt-2" style="background:#ff6600; color:#fff; border:none;"><i class="fa fa-plus"></i> Add Menu Item</a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div id="footer-include"></div>
  <script>
    // Load header and footer components dynamically
    fetch('components/header.html').then(res => res.text()).then(data => {
      document.getElementById('header-include').innerHTML = data;
    });
    fetch('components/footer.html').then(res => res.text()).then(data => {
      document.getElementById('footer-include').innerHTML = data;
      const yearSpan = document.getElementById('footerYear');
      if (yearSpan) {
        yearSpan.textContent = new Date().getFullYear();
      }
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
