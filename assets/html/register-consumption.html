<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register Consumption - PresChop</title>


  <link href="../css/bootstrap.min.css" rel="stylesheet">
  <link href="../css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">

</head>

<body>

  <div id="header-include"></div>
  <div class="main-content">
    <div class="container mt-4">

      <!-- Notification for Canteen Manager -->
      <!-- this is the alert for the canteen boss -->
      <!-- <div class="alert alert-warning alert-dismissible fade show" role="alert">
        <strong><i class="fa fa-bell"></i> Approval Needed!</strong> There are new workers pending approval. <a href="#" class="alert-link">Review now</a>.
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
      </div> -->

      <div class="card mx-auto mt-5" style="max-width: 600px;">
        <div class="card-body">
          <h2 class="card-title text-center mb-4" style="color:#ff6600;"><i class="fa fa-utensils"></i> Register Consumption</h2>
          <form>
            <div class="mb-3">
              <label for="workerSearch" class="form-label">Search Worker</label>
              <input type="text" class="form-control" id="workerSearch" placeholder="Type worker name to filter">
            </div>

            <div class="mb-3">
              <label for="worker" class="form-label">Worker</label>
              <select class="form-select" id="worker" required>
                <option value="">Select Worker</option>
                <option value="1">Ayuk Hillman</option>
                <option value="2">Neuyou Guilaine</option>
                
              </select>
            </div>

            <div class="mb-3">
              <label for="type" class="form-label">Food</label>
              <select class="form-select" id="typeOfFood" required>
                <option value="">Select Food</option>
                <option value="Food">Eru</option>
                <option value="Food">Beans</option>
                <option value="Food">Rice</option>
              </select>
            </div>

              <div class="mb-3">
              <label for="type" class="form-label">Drink</label>
              <select class="form-select" id="typeOfDrink" required>
                <option value="">Select Drink</option>
                <option value="Drink">Water</option>
                <option value="Drink">Fanta</option>
                <option value="Drink">Malta</option>
                <option value="Drink">None</option>
              </select>
            </div>

             <div class="mb-3">
              <label for="department" class="form-label">Department</label>
              <select class="form-select" id="department" required>
                <option value="">All Departments</option>
                <option value="IT">IT</option>
                <option value="Marketing">Marketing</option>
                <option value="Finance">Finance</option>
                <option value="Human Resources">Human Resources</option>
                <option value="Communication">Communication</option>
                <option value="Operations">Operations</option>
              </select>            
            </div>

            <div class="mb-3">
              <label for="status" class="form-label">Status</label>
              <select class="form-select" id="status" required>
                <option value="">Select Status</option>
                <option value="Permanent">Permanent</option>
                <option value="Temporal">Temporal</option>
                <option value="Intern">Intern</option>
              </select>
            </div>

            <div class="mb-3">
              <label for="amountFood" class="form-label">Food Amount Consumed</label>
              <input type="number" class="form-control" id="amountFood" min="0" step="1" required>
            </div>

            <div class="mb-3">
              <label for="amountDrink" class="form-label">Drink Amount Consumed</label>
              <input type="number" class="form-control" id="amountDrink" min="0" step="1" required>
            </div>

            <div class="mb-3">
              <label for="price" class="form-label">Price</label>
              <input type="number" class="form-control" id="price" min="0" step="1" required>
            </div>


            <div class="mb-3">
              <label for="date" class="form-label">Consumption Date</label>
              <input type="date" class="form-control" id="date" required>
            </div>

            <button type="submit" class="btn btn-primary w-100" style="background:#ff6600; border:none; border-radius: 50px;">Register Consumption</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <div id="footer-include"></div>

  
  <script src="../js/bootstrap.bundle.min.js"></script>

  <script>
    fetch('../../components/header.html').then(res => res.text()).then(data => {
      document.getElementById('header-include').innerHTML = data;
      
      const navLinks = document.querySelectorAll('#header-include .nav-link');
      navLinks.forEach(link =>{
        if (link.textContent.includes("Dashboard")) {
          link.href = "../../index.html";
          console.log(link.href);
        }
        if (link.textContent.includes("Register Worker")) {
          link.href = "./register-worker.html";
          console.log(link.href);
        }
        if (link.textContent.includes("Register Consumption")) {
          link.href = "./register-consumption.html";
          console.log(link.href);
        }
        if (link.textContent.includes("Worker Debts")) {
          link.href = "./worker-debts.html";
          console.log(link.href);
        }
        if (link.textContent.includes("Menu")) {
          link.href = "./menu-dashboard.html";
          console.log(link.href);
        }
        if (link.textContent.includes("Add Menu Item")) {
          link.href = "./menu-add.html";
          console.log(link.href);
        }
        if (link.textContent.includes("Menu List")) {
          link.href = "./menu-list.html";
          console.log(link.href);
        }
        if (link.textContent.includes("Worker List")) {
          link.href = "./worker-list.html";
          console.log(link.href);
        }
      });
    });

    fetch('../../components/footer.html').then(res => res.text()).then(data => {
      document.getElementById('footer-include').innerHTML = data;
      const yearSpan = document.getElementById('footerYear');
      if (yearSpan) {
        yearSpan.textContent = new Date().getFullYear();
      }

       const socialIcons = document.querySelectorAll("#footer-include .social-icons img");
       console.log(socialIcons);
      const newIcons = {
        facebook : '../images/fac.jpg',
        instagram : '../images/int.jpg',
        tiktok : '../images/tik.jpg',
        twitter : '../images/twi.jpg'
      };

      socialIcons.forEach(img => {
        const alt = img.alt?.toLowerCase();
        if(alt && newIcons[alt]){
          img.src = newIcons[alt];
        }

      });

    });
  </script>

  <script src="../js/custom/db.js"></script>
  <script src="../js/custom/register-consumption.js"></script>

</body>
</html>
