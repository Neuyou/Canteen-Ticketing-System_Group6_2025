<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Menu Item - PresChop</title>
  <link href="../css/bootstrap.min.css" rel="stylesheet">
  <link href="../css/all.min.css" rel="stylesheet">
  <!--link href="../fonts/googeRobotofonts.css" rel="stylesheet"-->
  <link rel="stylesheet" href="../css/styles.css">

</head>

<body>

  <div id="header-include"></div>
  <div class="main-content">
    <div class="container mt-4">

      <!-- Notification for Canteen Manager -->
      <!-- this is the alert for the canteen boss -->
      <!-- <div class="alert alert-warning alert-dismissible fade show" role="alert">
        <strong><i class="fa fa-bell"></i> Approval Needed!</strong> There are new workers pending approval. <a href="#" class="alert-link">Review now</a>.
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
      </div> -->

      <div class="card mx-auto mt-5" style="max-width: 600px;">
        <div class="card-body">
          <h2 class="card-title text-center mb-4" style="color:#ff6600;"><i class="fa fa-plus"></i> Add Menu Item</h2>
          <form>
            <div class="mb-3">
              <label class="form-label">Item Name</label>
              <input type="text" class="form-control" placeholder="Enter name" required>
            </div>

            <div class="mb-3">
              <label class="form-label">Type</label>
              <select class="form-select" required>
                <option value="">Select type</option>
                <option value="Food">Food</option>
                <option value="Drink">Drink</option>
              </select>
            </div>

            <div class="mb-3">
              <label class="form-label">Description</label>
              <textarea class="form-control" rows="2"></textarea>
            </div>

            <div class="mb-3">
              <label class="form-label">Price</label>
              <input type="number" class="form-control" min="0" step="1" required>
            </div>

            <div class="mb-3">
              <label class="form-label">Day(s) of the Week</label>
              <select class="form-select" multiple required>
                <option>Monday</option>
                <option>Tuesday</option>
                <option>Wednesday</option>
                <option>Thursday</option>
                <option>Friday</option>
                <option>Saturday</option>
                <option>Sunday</option>
              </select>
              <small class="text-muted">Hold Ctrl to select multiple days.</small>
            </div>

            <button type="submit" class="btn w-100" style="background:#ff6600; color:#fff; border:none; border-radius: 50px;">Add Menu Item</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <div id="footer-include"></div>

  <script>

    
    fetch('../../components/header.html').then(res => res.text()).then(data => {
      document.getElementById('header-include').innerHTML = data;
      
      const navLinks = document.querySelectorAll('#header-include .nav-link');
      navLinks.forEach(link =>{
        if (link.textContent.includes("Dashboard")) {
          link.href = "../../index.html";
          console.log(link.href);
        }
        if (link.textContent.includes("Register Worker")) {
          link.href = "./register-worker.html";
          console.log(link.href);
        }
        if (link.textContent.includes("Register Consumption")) {
          link.href = "./register-consumption.html";
          console.log(link.href);
        }
        if (link.textContent.includes("Worker Debts")) {
          link.href = "./worker-debts.html";
          console.log(link.href);
        }
        if (link.textContent.includes("Menu")) {
          link.href = "./menu-dashboard.html";
          console.log(link.href);
        }
        if (link.textContent.includes("Add Menu Item")) {
          link.href = "./menu-add.html";
          console.log(link.href);
        }
        if (link.textContent.includes("Menu List")) {
          link.href = "./menu-list.html";
          console.log(link.href);
        }
        if (link.textContent.includes("Worker List")) {
          link.href = "./worker-list.html";
          console.log(link.href);
        }
      });
    });
  
    fetch('../../components/footer.html').then(res => res.text()).then(data => {
      document.getElementById('footer-include').innerHTML = data;
      const yearSpan = document.getElementById('footerYear');
      if (yearSpan) {
        yearSpan.textContent = new Date().getFullYear();
      }

      const socialIcons = document.querySelectorAll("#footer-include .social-icons img");
      console.log(socialIcons);

      const newIcons = {
        facebook : '../images/fac.jpg',
        instagram : '../images/int.jpg',
        tiktok : '../images/tik.jpg',
        twitter : '../images/twi.jpg'
      };

      socialIcons.forEach(img => {
        const alt = img.alt?.toLowerCase();
        if(alt && newIcons[alt]){
          img.src = newIcons[alt];
        }
      });

    });
  </script>

  <script src="../js/bootstrap.bundle.min.js"></script>

</body>
</html>
