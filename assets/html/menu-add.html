<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Menu Item - PresChop</title>
  <link href="../css/bootstrap.min.css" rel="stylesheet">
  <link href="../css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">

</head>

<body>

<div class="top-wrapper">

  <div id="header-include"></div>
  <div class="main-content">
    <div class="container mt-4">
   <div class="card mx-auto mt-5" style="max-width: 600px;">
        <div class="card-body">
          <h2 class="card-title text-center mb-4" style="color:#ff6600;"><i class="fa fa-plus"></i> Add Menu Item</h2>
          <form>
            <div class="mb-3">
              <label class="form-label">Item Name</label>
              <input type="text" class="form-control" id="" placeholder="Enter name" required>
            </div>

            <div class="mb-3">
              <label class="form-label">Type</label>
              <select class="form-select" id="type" required>
                <option value="">Select type</option>
                <option value="Food">Food</option>
                <option value="Drink">Drink</option>
              </select>
            </div>

            <div class="mb-3">
              <label class="form-label">Description</label>
              <textarea class="form-control" rows="2" id="description"></textarea>
            </div>

            <div class="mb-3">
              <label class="form-label">Price</label>
              <input type="number" class="form-control" id="price" min="0" step="1" required>
            </div>

            <div class="mb-3">
              <label class="form-label">Day of the Week</label>
              <select class="form-select" id="day" multiple required>
                <option>Monday</option>
                <option>Tuesday</option>
                <option>Wednesday</option>
                <option>Thursday</option>
                <option>Friday</option>
                <option>Saturday</option>
                <option>Sunday</option>
              </select>
              <small class="text-muted">Hold Ctrl to select multiple days.</small>
            </div>

            <button type="submit" class="btn w-100" style="background:#ff6600; color:#fff; border:none; border-radius: 50px;">Add Menu Item</button>
          </form>
        </div>
      </div>
    </div>
  </div>

</div>

  <div id="footer-include"></div>

  <script src="../js/bootstrap.bundle.min.js"></script>
  <script src="../js/custom/db.js"></script>
  <script src="../js/custom/menu-add.js"></script>

</body>
</html>
