<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu History - PresChop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css?family=Roboto:400,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/styles.css">
</head>
<body>
  <div id="header-include"></div>
  <div class="main-content">
    <div class="container mt-4">
      <!-- Notification for Canteen Manager -->
      <!-- this is the alert for the canteen boss -->
      <div class="alert alert-warning alert-dismissible fade show" role="alert">
        <strong><i class="fa fa-bell"></i> Approval Needed!</strong> There are new workers pending approval. <a href="#" class="alert-link">Review now</a>.
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
      </div>
      <h1 class="mb-4" style="color:#ff6600;">Menu History</h1>
      <div class="table-responsive">
        <table class="table table-bordered align-middle">
          <thead class="table-dark">
            <tr>
              <th>Date</th>
              <th>Item</th>
              <th>Action</th>
              <th>User</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>2024-06-01</td>
              <td>Jollof Rice</td>
              <td>Added</td>
              <td>Manager</td>
            </tr>
            <tr>
              <td>2024-06-02</td>
              <td>Fruit Juice</td>
              <td>Edited</td>
              <td>Manager</td>
            </tr>
            <!-- More rows as needed -->
          </tbody>
        </table>
      </div>
    </div>
  </div>
  <div id="footer-include"></div>
  <script>
    // Load header and footer components dynamically
    fetch('components/header.html').then(res => res.text()).then(data => {
      document.getElementById('header-include').innerHTML = data;
    });
    fetch('components/footer.html').then(res => res.text()).then(data => {
      document.getElementById('footer-include').innerHTML = data;
      const yearSpan = document.getElementById('footerYear');
      if (yearSpan) {
        yearSpan.textContent = new Date().getFullYear();
      }
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
