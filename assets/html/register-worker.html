<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register Worker - PresChop</title>
 
  <link href="../css/bootstrap.min.css" rel="stylesheet">
  <link href="../css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">

</head>

<body>

  <div id="header-include"></div>
  <div class="main-content">
    <div class="container mt-4">

      <!-- Notification for Canteen Manager -->
      <!-- this is the alert for the canteen boss -->
      <!-- <div class="alert alert-warning alert-dismissible fade show" role="alert">
        <strong><i class="fa fa-bell"></i> Approval Needed!</strong> There are new workers pending approval. <a href="#" class="alert-link">Review now</a>.
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
      </div> -->

      <div class="card mx-auto mt-5" style="max-width: 600px;">
        <div class="card-body">
          <h2 class="card-title text-center mb-4" style="color:#ff6600;"><i class="fa fa-user-plus"></i> Register Worker</h2>
          <form>
            <div class="mb-3">
              <label for="firstName" class="form-label">First Name</label>
              <input type="text" class="form-control" id="firstName" placeholder="Enter first name" required>
            </div>

            <div class="mb-3">
              <label for="lastName" class="form-label">Last Name</label>
              <input type="text" class="form-control" id="lastName" placeholder="Enter last name" required>
            </div>

            <div class="mb-3">
              <label for="dob" class="form-label">Date of Birth</label>
              <input type="date" class="form-control" id="dob" required>
            </div>

            <div class="mb-3">
              <label for="pob" class="form-label">Place of Birth</label>
              <input type="text" class="form-control" id="pob" placeholder="Enter your place of birth" required>
            </div>

            <div class="mb-3">
              <label for="gender" class="form-label">Gender</label>
              <select class="form-select" id="gender" required>
                <option value="">Select Gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
              </select>
            </div>

             <div class="mb-3">
              <label for="department" class="form-label">Department</label>
              <select class="form-select" id="department" required>
                <option value="">Select department</option>
                <option value="IT">IT</option>
                <option value="Marketing">Marketing</option>
                <option value="Finance">Finance</option>
                <option value="Human Resources">Human Resources</option>
                <option value="Communication">Communication</option>
                <option value="Operations">Operations</option>
              </select>            
            </div>

            <div class="mb-3">
              <label for="status" class="form-label">Status</label>
              <select class="form-select" id="status" required>
                <option value="">Select Status</option>
                <option value="Permanent">Permanent</option>
                <option value="Temporal">Temporal</option>
                <option value="Intern">Intern</option>
              </select>
            </div>

            <button type="submit" class="btn btn-primary w-100" style="background:#ff6600; border:none; border-radius: 50px;">Register Worker</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <div id="footer-include"></div>

 
  <script src="../js/bootstrap.bundle.min.js"></script>

  <script>
      const socialIcons = document.querySelectorAll("#footer-include .social-icons img");
      console.log(socialIcons);
      const newIcons = {
        facebook : '../images/fac.jpg',
        instagram : '../images/int.jpg',
        tiktok : '../images/tik.jpg',
        twitter : '../images/twi.jpg'
      };

      socialIcons.forEach(img => {
        const alt = img.alt?.toLowerCase();
        if(alt && newIcons[alt]){
          img.src = newIcons[alt];
        }

      });
  </script>
 
 <script src="../js/custom/db.js"></script>
 <script src="../js/custom/register-worker.js"></script>

</body>
</html>
