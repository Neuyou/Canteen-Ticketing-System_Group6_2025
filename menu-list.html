<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu List - PresChop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css?family=Roboto:400,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/styles.css">
</head>
<body>
  <div id="header-include"></div>
  <div class="main-content">
    <div class="container mt-4">
      <!-- Notification for Canteen Manager -->
      <!-- this is the alert for the canteen boss -->
      <div class="alert alert-warning alert-dismissible fade show" role="alert">
        <strong><i class="fa fa-bell"></i> Approval Needed!</strong> There are new workers pending approval. <a href="#" class="alert-link">Review now</a>.
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
      </div>
      <h1 class="mb-4" style="color:#ff6600;">Menu List</h1>
      <!-- Filters -->
      <form class="row g-2 mb-4 align-items-end">
        <div class="col-12 col-sm-4">
          <label class="form-label mb-1">Item Name</label>
          <input type="text" class="form-control" placeholder="Enter name">
        </div>
        <div class="col-6 col-sm-3">
          <label class="form-label mb-1">Type</label>
          <select class="form-select">
            <option value="">All</option>
            <option value="Food">Food</option>
            <option value="Drink">Drink</option>
          </select>
        </div>
        <div class="col-6 col-sm-3">
          <label class="form-label mb-1">Day</label>
          <select class="form-select">
            <option value="">All</option>
            <option>Monday</option>
            <option>Tuesday</option>
            <option>Wednesday</option>
            <option>Thursday</option>
            <option>Friday</option>
            <option>Saturday</option>
            <option>Sunday</option>
          </select>
        </div>
        <div class="col-12 col-sm-2 d-grid">
          <button type="button" class="btn" style="background:#ff6600; color:#fff; border:none;">Clear</button>
        </div>
      </form>
      <div class="table-responsive">
        <table class="table table-bordered align-middle">
          <thead class="table-dark">
            <tr>
              <th>Item Name</th>
              <th>Type</th>
              <th>Description</th>
              <th>Price</th>
              <th>Day(s)</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>Jollof Rice</td>
              <td>Food</td>
              <td>Spicy rice with tomato sauce</td>
              <td>1000</td>
              <td>Monday, Wednesday</td>
              <td>
                <button class="btn action-btn me-1" style="background:#ff6600; color:#fff; border:none;"><i class="fa fa-edit"></i> Edit</button>
                <button class="btn action-btn" style="background:#ff6600; color:#fff; border:none;"><i class="fa fa-trash"></i> Delete</button>
              </td>
            </tr>
            <tr>
              <td>Fruit Juice</td>
              <td>Drink</td>
              <td>Freshly squeezed orange juice</td>
              <td>500</td>
              <td>Tuesday, Friday</td>
              <td>
                <button class="btn action-btn me-1" style="background:#ff6600; color:#fff; border:none;"><i class="fa fa-edit"></i> Edit</button>
                <button class="btn action-btn" style="background:#ff6600; color:#fff; border:none;"><i class="fa fa-trash"></i> Delete</button>
              </td>
            </tr>
            <!-- More rows as needed -->
          </tbody>
        </table>
      </div>
    </div>
  </div>
  <div id="footer-include"></div>
  <script>
    // Load header and footer components dynamically
    fetch('components/header.html').then(res => res.text()).then(data => {
      document.getElementById('header-include').innerHTML = data;
    });
    fetch('components/footer.html').then(res => res.text()).then(data => {
      document.getElementById('footer-include').innerHTML = data;
      const yearSpan = document.getElementById('footerYear');
      if (yearSpan) {
        yearSpan.textContent = new Date().getFullYear();
      }
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
